[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoblock-scenecompiler"
version = "0.1.0"
description = "Geographic 3D flyover reference compiler and ComfyUI prototype"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "rasterio>=1.4,<2",
  "pyproj>=3.7,<4",
  "trimesh>=4.0,<6",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
buildings = ["laspy[lazrs]>=2.6,<3", "shapely>=2.1,<3", "pyarrow>=17"]
comfy = ["comfy-sdk>=0.4,<0.5"]
touchdown = ["opencv-python-headless>=4.9,<5"]
# the Touchdown web app (app/): server, queue and worker; httpx and Pillow are already core dependencies
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1", "tomli-w>=1.0,<2", "pillow-heif>=1.8.1,<2"]

[project.scripts]
geoblock = "geoblock_core.cli:main"
geoblock-run = "geoblock_core.run:main"
touchdown-app = "server.cli:main"
touchdown-worker = "worker.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoblock_core", "app/server", "app/worker"]

[tool.hatch.build.targets.wheel.force-include]
"app/web" = "server/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
