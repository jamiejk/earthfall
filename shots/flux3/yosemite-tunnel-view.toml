# FLUX 3 Yosemite Tunnel View (17 Oct): from shots/flux3/grand-canyon-mather.toml, with the shot place words and the
# terrain table from shots/yosemite-terrain-one-pass.toml; paved scene, so the default surface (no natural-ground search).

output = "outputs/touchdown"

[shot]
name = "flux3-yosemite-tunnel-view"
place = "yosemite-tunnel-view"           # place catalog id (US only: NAIP)
subject = "../subjects/test-subject-red-coat.jpg"   # stand-in for a user photo (FLUX painted it); swap in a real one
person = "a young woman with short curly dark hair, wearing a long red raincoat over a grey hoodie, black jeans and white trainers"
scene = "on an open paved approach to the Tunnel View overlook in Yosemite, with the low granite wall behind her and El Capitan, Bridalveil Fall and Half Dome across the forested valley beyond"
region = "the Sierra Nevada mountains of California"
approach = "the forested granite valley of Yosemite, looking forward and down at the Wawona Road winding through pine forest to the Tunnel View overlook"
swoop_view = "the pine forest above Yosemite Valley, about a hundred and seventy metres up, looking forward and down at the Wawona Road and the paved overlook beside it"
swoop_toward = "Half Dome at the far end of the valley"
ambient = "the pine branches sway, the long white plume of Bridalveil Fall streams and drifts in the wind, mist rises off the valley, and a hawk circles far out over the trees"
descent = "45"           # after the cloud: "45" dives at ~45 degrees (Jamie's pick), "90" tips straight down in the cloud

[terrain]
enabled = true
project = "CA_YosemiteNP_2019_D19"
utm_zone = 11
heading = 75.1
target_x = 6
target_y = 8

[stills]
layout_gate = "landmarks"  # the granite wall is real but the measured pavement smears it; stop only on landmark shifts
flux3 = ["end", "opener_end", "orbit", "cloud"]   # Jamie 17 Oct: FLUX 3 for everything
flux3_url = "http://127.0.0.1:8193"        # comfy-api-proxy in front of the v0.41.3 ComfyUI
flux3_free_url = "http://127.0.0.1:8192"   # unloads FLUX 3 after the stills, before the LTX stages load
seed = 20261009          # orbit still = seed + 1, whiteout still = seed + 140 (as in r3-cloud)
orbit_region = "the coast of central California and the Sierra Nevada seen from about 400 kilometres up, small, flat and hazy at this scale"   # FLUX 3: no cloud deck below
# the end still when the shot gives none: wide, full length, like Twin Peaks' ground_end.png, so the swoop lands
# on a scene and the living end pushes in (a waist-up FLUX portrait leaves the swoop nowhere to go)
end_prompt = "Make a real eye-level photograph from exactly the same camera viewpoint and compass direction at Yosemite Tunnel View overlook. Keep the outlines and positions of the distant granite cliffs, the opening of Yosemite Valley, the sky, the horizon and the overlook pavement where image 1 has them; do not rotate or move them. Draw the cliffs as real pale granite with vertical cracks, streaks and dark conifer forest below. In the center, 10 metres from the camera on the pavement, add {person}, standing still facing the camera, shown full length. The foreground is clean asphalt with a low stone overlook wall in the position image 1 shows. Natural daylight and realistic human scale. No text."
opener_end_prompt = "A real photograph taken at eye level from a path about fifteen metres away: {person} stands {scene}, seen full length, small in the middle of the frame, still and facing the camera, on open paved ground that runs straight from the bottom of the frame to their feet, with the wall behind them (the swoop flies in across the open ground). The wide view around and behind fills most of the frame, sharp and real. Natural daylight, a few soft clouds, 35mm lens, sharp, natural colour, real photo, no text."

[opener]                 # LTX 2.5 first/last, orbit -> whiteout -> end still; only `keep` frames are used
frames = 241
cloud_at = 0          # 18 Oct: no cloud-still pin (the opener dissolved globe -> cumulus inside the kept frames, MV v9 f6-9)
keep = 22                # at most this many opener frames before the cloud (was 26; Jamie 10 Oct: drop in quicker)
skip = 10                # drop the first 10 opener frames: it eases out of the pinned orbit still (~0.4 s nearly static in every FLUX 3 cut)
seeds = [20261009]

[cloud]                  # LTX 2.5 image-to-video from the opener's frame `keep`
start_at = "auto"        # start from the last opener frame before it fogs (opener keep is the upper bound)
fog_contrast = 0.6       # cut the opener once its contrast falls under this share of its first frames' (0.45 left haze)
frames = 97
speed = 10.0             # target flow (px/frame at 480 wide) for the integer-step retime (was 7: faster plunge)
cap = 3                  # 18 Oct: steps of 5 made the cloud passage jump (MV v10 f18-24); at most 3
ramp = 6                 # step limit eases up from 1 over the first kept frames (a full step at the join popped)
max_kept = 40           # room for the passage at cap 3 (was 32)
prompt_45 = "The camera angle stays locked: it keeps looking forward and down at exactly the same angle, with the thin bright horizon line held at the top edge of the frame, while the camera flies fast forward and down into a towering bank of billowing white cumulus cloud. Dense cloud walls and torn wisps stream past the lens at high speed, sunlit edges and deep blue-grey shadow inside the cloud, turbulent churning vapour, the cloud growing denser until everything is bright glowing white haze. Steady locked camera angle, real aerial footage, natural light, photorealistic."
prompt_90 = "One continuous shot with no cuts. The camera plunges into a towering bank of billowing white cumulus cloud and, as it dives, pitches steadily downward until it is looking straight down, the horizon sliding up and out of the top of the frame. Dense cloud walls and torn wisps stream past the lens at high speed, sunlit edges and deep blue-grey shadow inside the cloud, turbulent churning vapour rushing up toward the camera, the cloud growing denser until everything is bright glowing white haze. Real aerial footage, natural light, photorealistic."
seeds = [4]

[dive]                   # no model: nested NAIP squares around the landing; the sub-table matching the descent applies
sea = false             # inland mountain scene; skip unnecessary water-mask model work
clear = 16               # frames thinning out of the cloud mist
aim = 15                 # metres past the landing the dive ends looking at
# spin: heading the dive faces; default = the place's view heading (46.9 at Twin Peaks)

[dive.oblique]           # descent 45: leave the cloud looking forward, tip to ~45 deg, dive at the landing
from_height_m = 7000     # height at the cloud exit
to_height_m = 175        # height at the hand-off to the swoop
frames = 48              # FLUX 3 v3 (17 Oct): shorter, faster computed dive (was 64)
start_pitch_deg = 70     # degrees from straight down at the cloud exit: horizon near the top, as in the cloud shot
pitch_deg = 45
turn_frames = 28

[dive.nadir]             # descent 90: looking straight down after the cloud, pitch up at the end
from_m = 8100            # footprint at the cloud exit
to_m = 800               # footprint where the pitch-up starts
nadir_frames = 36        # was 52
pitch_frames = 30        # was 41
pitch_deg = 32

[swoop]                  # LTX 2.5 first/last: the dive's last frames -> the end still
frames = 81              # measured terrain layout guide length
prompt = "One continuous forward descent following the exact straight camera path of the guide video. The paved road and overlook, the low granite wall, the pine forest, El Capitan and Half Dome remain in their measured positions. The person stands on the same paved spot throughout. The camera levels out toward {person} standing {scene} and eases into an eye-level view. Natural daylight, realistic depth and parallax, photorealistic."
seeds = [7]              # fixed before this build; no per-stage selection
# terrain v2v follows the rendered guide directly; no separate video prefix

[body]
max_step = 3             # build2: integer step = round(dive exit flow / swoop native flow), at most this
low = 7.0                # step down (never back up) once step x native flow falls below this (px/frame at 480 wide)
seam_span = 14           # build2 SOFT: frames of blur + Lab pull toward the dive's last frame
[body.fx]                # dive_fx over the dive: shake, radial blur, drawn speed lines (Jamie keeps the lines)
shake_px = 22.0          # FLUX 3 v3: stronger fall shake (was 16)
roll = 0.5
blur = 0.06              # FLUX 3 v3: more radial motion blur (was 0.035)
streaks = 12
streak_width = 2         # thinner than the nadir lines (scratchy on the angled city) ...
streak_alpha = 0.8
extend = 14              # carry shake/blur/lines past the hand-over so the join hides in motion

[end]                    # LTX 2.5 locked living end with a video-prefix handoff
# A pinned 9-frame video prefix carries the measured approach through the join. The endpoint pin
# holds the scene stable; no digital zoom follows the swoop.
frames = 73
prefix_frames = 9
still_hold = 26   # the last second is held on the end still: the video model's face is a blur, the photograph's is not
zoom = 1.3               # FLUX 3 v4: slow push-in on the living end, as Higgsfield ends (was 1.0, static)
zoom_focus_x = 0.5
zoom_focus_y = 0.42      # push toward her upper body
lock_prompt = "A continuous real photograph come to life of {person} standing {scene}. The camera stays still on a tripod with exactly the same framing throughout; it does not tilt, pan or move closer. The person stays on the same spot facing the camera, breathing, blinking and shifting their weight a little, and the wind moves their hair and coat. All around them the scene is alive: {scene_ambient}. Natural daylight, photorealistic, no cuts."
lock_pin = "none"         # 17 Oct isxirs 801f7cd: unpinned, camera still, motion from the scene type
settle = 3.5             # used only without `start`: mean grey difference (240 px wide) below which the swoop counts as settled (uncalibrated)
ramp = 24
prompt = "One continuous shot with no cuts, a real photograph come to life. The camera holds almost still, easing in only slightly toward {person} standing {scene}, who stays on the same spot, looking at the camera, breathing and blinking. Everything around is alive in a strong gusty breeze: {ambient}; their hair and clothes flap and ripple in the wind, and low white clouds slide visibly across the sky. Constant natural motion everywhere in the frame, natural colour, sharp photographic detail, photorealistic."
seeds = [3]

[face]                   # off: pasting a face crop onto the frames reads as a patch (a yellow blob on
                     # Monument Valley, 21 Oct), and the end still already carries a sharp face
enabled = false
source = "final_frame"    # literal pixels preserve identity; optional "flux" edit remains available
reference_from_last = 20
lead = 14
ramp = 12
hold_after = 8
fade = 16
strength = 0.65

[sound]                  # LTX 2.3 Foley V2A, wind only (Jamie 10 Oct); windows placed by segment
engine = "procedural"     # touchdown/wind_bed.py (sound thread); "foley" = the LTX Foley V2A windows below
wind_seed = 7
enabled = true           # procedural wind bed from the sound thread (Foley was "still nuts-o", Jamie 10 Oct)
workflow = "ltx-2.3-foley-v2a.json"   # from the gated HF repo, not committed: put it next to this manifest or give a path
lora = "ltx-2.3-22b-lora-foley-v2a-1.0.safetensors"
checkpoint = "ltx-2.3-22b-dev-fp8.safetensors"            # as on the desktop's 8190 ComfyUI
text_encoder = "gemma_3_12B_it_fp8_scaled.safetensors"   # loaded with LTXAVTextEncoderLoader
decomb = true
seeds = [7]
fade = ["end-14", "end+56", -28]   # v4: 180:250 with the living end at f194
[sound.pace]
peak = 2.2              # FLUX 3 v3: accelerate through the dive into the hand-off, ease back to 1x near the person
dive_start = 0.1
swoop_end = 0.6
[[sound.windows]]
name = "dive"
from = "opener"
to = "swoop"
prompt = "Pure wind noise only. Violent high-altitude wind roaring past at extreme speed, heavy buffeting turbulence and shuddering air pressure as the camera punches down through thick cloud, deep rumbling gusts, a sustained roaring rush of air through the dive."
negative = "music, singing, melody, instruments, speech, talking, voice, narration, birds, animals, engine, aircraft, traffic, cars, city, footsteps, rustling, fabric, clicks, beeps, low quality, distorted, clipping, silence"
gain_db = -8
lowpass = 1500
highpass = 80
[[sound.windows]]
name = "swoop"
from = "swoop-9"
to = "swoop+72"
prompt = "Pure wind noise only. A fast rushing whoosh of wind as the camera sweeps down low over a hillside, the roar easing and softening as it slows."
negative = "music, singing, melody, instruments, speech, talking, voice, narration, birds, animals, engine, aircraft, traffic, cars, city, footsteps, rustling, grass, fabric, clicks, beeps, low quality, distorted, clipping"
[[sound.windows]]
name = "hilltop"
from = "end-36"
to = "total"
prompt = "Pure wind noise only. A soft, light, steady breeze on an open hilltop, gentle and quiet."
negative = "music, singing, melody, instruments, speech, talking, voice, narration, birds, seagull, animals, engine, traffic, cars, city, footsteps, rustling, fabric, flapping, clicks, beeps, low quality, distorted, clipping"
